site_name: Outreach
theme:
  name: material
  language: en
  icon:
    logo: material/bullhorn
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
copyright: >
  Published by <strong>Illyrian Brains</strong>.
extra_css:
  - assets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js
  - assets/evidence.js
  - assets/directory.js
  - assets/timeline.js
  - assets/media_coverage.js
  - assets/outreach_directory.js
  - assets/education_map.js
plugins:
  - search
nav:
  - Home: index.md
  - Letters:
      - Overview: messages/index.md
      - By recipient:
          - Media: messages/urgent-media.md
          - International institution: messages/urgent-partners.md
          - International representative: messages/urgent-representative.md
      - Languages:
          - English: languages/en.md
          - Albanian: languages/sq.md
          - German: languages/de.md
          - Italian: languages/it.md
          - French: languages/fr.md
          - Dutch: languages/nl.md
          - Spanish: languages/es.md
          - Swedish: languages/sv.md
          - Polish: languages/pl.md
  - Outreach:
      - Media: media-coverage.md
      - Institutions: institutions.md
      - Parties: parties.md
  - Background:
      - Overview: background/index.md
      - Chapters:
          - "1. Who": background/who.md
          - "2. What": background/demands.md
          - "3. Where": background/where.md
          - "4. When": timeline.md
          - "5. How": background/how.md
      - More information:
          - Universities and gymnasiums: background/education-map.md
          - Legal framework: background/legal-framework.md
          - Documentation and methods: background/documentation.md
          - Gallery: evidence-gallery.md
          - About this project: editorial-policy.md
          - Incidents: incidents.md
          - GenZ video: genz.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
