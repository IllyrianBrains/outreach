site_name: Outreach
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/evidence.js
  - assets/directory.js
plugins:
  - search
nav:
  - Home: index.md
  - Countries:
      - Choose a country: countries/index.md
      - "🇦🇹 Austria": countries/austri.md
      - "🇧🇪 Belgium": countries/belgjike.md
      - "🇨🇿 Czechia": countries/ceki.md
      - "🇩🇰 Denmark": countries/danimarke.md
      - "🇫🇮 Finland": countries/finlande.md
      - "🇫🇷 France": countries/france.md
      - "🇩🇪 Germany": countries/gjermani.md
      - "🇳🇱 Netherlands": countries/holande.md
      - "🇮🇪 Ireland": countries/irlande.md
      - "🇮🇹 Italy": countries/itali.md
      - "🇽🇰 Kosovo": countries/kosove.md
      - "🇱🇺 Luxembourg": countries/luksemburg.md
      - "🇲🇹 Malta": countries/malte.md
      - "🇬🇧 United Kingdom": countries/mbreteria-e-bashkuar.md
      - "🇳🇴 Norway": countries/norvegji.md
      - "🇵🇱 Poland": countries/poloni.md
      - "🇪🇸 Spain": countries/spanje.md
      - "🇸🇪 Sweden": countries/suedi.md
      - "🇦🇱 Albania": countries/shqiperi.md
      - "🇺🇸 United States": countries/shba.md
      - "🇨🇭 Switzerland": countries/zvicer.md
  - Letters:
      - English master: languages/en.md
      - Albanian: languages/sq.md
      - German: languages/de.md
      - Italian: languages/it.md
      - French: languages/fr.md
      - Dutch: languages/nl.md
      - Spanish: languages/es.md
      - Swedish: languages/sv.md
      - Polish: languages/pl.md
      - Media: messages/urgent-media.md
      - Civil society: messages/urgent-partners.md
  - Background:
      - Why: background/index.md
      - Who: background/who.md
      - What: background/demands.md
      - Where: background/where.md
      - How: background/how.md
  - Evidence:
      - Incident records: incidents.md
      - Latest briefing: briefs/tirana-2026-10-13-15-urgent.md
      - Photo gallery: evidence-gallery.md
      - Search sources: directory.md
      - How we verify: methodology/verification.md
      - Editorial standards: editorial-policy.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
